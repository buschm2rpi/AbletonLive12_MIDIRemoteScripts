# mypy configuration for type-checking the Launchpad95_typed remote script.
#
# Run from the worktree root:
#
#   mypy --config-file Launchpad95_typed/mypy.ini Launchpad95_typed/
#
# The stub package in ./stubs shadows the host-provided ``Live`` module and
# the decompiled (partially corrupted) ../_Framework package. mypy searches
# mypy_path entries before the source directory, so ``import Live`` /
# ``from _Framework.X import Y`` resolve to the stubs. See stubs/README.md.
#
# tests/ is a runtime-fake pytest suite (not type-checked here); stubs/ is
# checked implicitly as the import target.
#
# NOTE: keep ``exclude`` on a single line — mypy 2.x mis-handles
# multi-line exclude values (it re-ingests the config file as a source).

[mypy]
python_version = 3.11
mypy_path = $MYPY_CONFIG_FILE_DIR/stubs
exclude = ^Launchpad95_typed/(tests|stubs)/
